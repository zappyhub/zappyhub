services:
  backend:
    build: ./apps/backend
    ports:
      - "3000:3000"
    env_file: ./apps/backend/.env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: zappy
      POSTGRES_PASSWORD: zappy
      POSTGRES_DB: zappyhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  postgres_data:

